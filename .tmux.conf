set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,ghostty:RGB'
set -g allow-passthrough on

set-option -g focus-events on
set -g mouse on 

set -g prefix C-a
unbind C-b
set -s escape-time 50
set -g base-index 1
set -w -g pane-base-index 1

bind r \
    source-file ~/.tmux.conf \; \
    display-message "Configuration reloaded"

bind | split-window -h
bind - split-window -v
:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-h select-window -t :-
bind C-l select-window -t :+


bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

#LAYOUT
#VI##### GENERAL #####
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

##### BASE STYLE (GitHub Dark Dimmed) #####
if-shell 'defaults read -g AppleInterfaceStyle >/dev/null 2>&1' \
    'set -g @appearance dark; source-file ~/.dotfiles/.tmux.theme-dark.conf' \
    'set -g @appearance light; source-file ~/.dotfiles/.tmux.theme-light.conf'

set-hook -g client-attached 'if-shell "defaults read -g AppleInterfaceStyle >/dev/null 2>&1" "set -g @appearance dark; source-file ~/.dotfiles/.tmux.theme-dark.conf" "set -g @appearance light; source-file ~/.dotfiles/.tmux.theme-light.conf"'
set-hook -g client-dark-theme 'set -g @appearance dark; source-file ~/.dotfiles/.tmux.theme-dark.conf'
set-hook -g client-light-theme 'set -g @appearance light; source-file ~/.dotfiles/.tmux.theme-light.conf'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Mac
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
# Linux
# set -s copy-command 'xclip -in -selection clipboard'
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'




