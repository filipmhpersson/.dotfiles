set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,ghostty:RGB'
set -g allow-passthrough on

set-option -g focus-events on

set -g prefix C-a
unbind C-b
set -s escape-time 50
set -g base-index 1
set -w -g pane-base-index 1

bind r \
    source-file ~/.tmux.conf \; \
    display-message "Configuration reloaded"

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-h select-window -t :-
bind C-l select-window -t :+

#LAYOUT
#VI##### GENERAL #####
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

##### BASE STYLE (GitHub Dark Dimmed) #####
set -g status-style fg=#adbac7,bg=#22272e
set -g message-style fg=#adbac7,bg=#2d333b
set -g pane-border-style fg=#444c56
set -g pane-active-border-style fg=#6e7681

##### WINDOW LIST #####
# Inactive windows
set -g window-status-style fg=#768390,bg=#22272e
set -g window-status-format " #I:#W "

# Active window (subtle, not loud)
set -g window-status-current-style fg=#adbac7,bg=#2d333b
set -g window-status-current-format " #[fg=#539bf5]#I#[fg=#adbac7]:#W "

##### LEFT SIDE #####
set -g status-left "#[fg=#539bf5]#S #[fg=#444c56]•"

##### RIGHT SIDE #####
set -g status-right "\
#[fg=#57ab5a]#(whoami) \
#[fg=#444c56]• \
#[fg=#c69026]%H:%M \
#[fg=#444c56]• \
#[fg=#768390]%d %b"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Mac
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
# Linux
# set -s copy-command 'xclip -in -selection clipboard'
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'





